# https://docs.amvera.ru/applications/environments/nodejs-server.html
meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm run build

# dist/ нет в Git — проверка «файл в репо» в UI падает на scriptName: dist/index.js
run:
  command: npm run start
  containerPort: 3000
